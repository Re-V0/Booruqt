# Builds, tests and packages B.LAIR_QT on every supported system.
#
# Runs on every push to main (as a check: nothing is published) and is
# called by release.yml for a tag, which then attaches the packages to the
# GitHub release. GitHub is a push mirror of GitLab, so a push to GitLab's
# main reaches this workflow through the mirror.
#
# Every job runs the test suite before packaging, so a package exists only
# for a build whose tests passed.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to build'
        type: string
        required: true

permissions:
  contents: read

env:
  # A tag when called by release.yml, otherwise the pushed commit.
  REF: ${{ inputs.ref || github.sha }}
  QT_VERSION: '6.8.3'

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-multimedia qt6-tools python

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
          path: repo

      # The PKGBUILD in the repo builds a release tag from GitLab. Here it
      # builds this exact checkout instead, so a push to main is tested before
      # any tag for its version exists. makepkg refuses to run as root.
      - name: Build, test, package
        run: |
          commit=$(git -C repo rev-parse HEAD)
          mkdir pkgbuild
          sed "s|^source=.*|source=(\"blairqt::git+file://$GITHUB_WORKSPACE/repo#commit=$commit\")|" \
            repo/PKGBUILD > pkgbuild/PKGBUILD
          grep -q "#commit=$commit" pkgbuild/PKGBUILD
          useradd -m builder
          chown -R builder: .
          cd pkgbuild
          sudo -u builder makepkg --noconfirm

      # The name filter skips the blairqt-debug package makepkg also builds.
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: pkgbuild/blairqt-[0-9]*-x86_64.pkg.tar.zst
          if-no-files-found: error

  deb:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    # One .deb per release: each ships a different Qt, and dpkg-shlibdeps
    # writes the Qt version found at build time as the minimum. A package
    # built on Debian 13 (Qt 6.8) would refuse to install on Ubuntu 24.04
    # (Qt 6.4).
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian 13
            image: debian:13
            suffix: debian13
          - label: Ubuntu 24.04
            image: ubuntu:24.04
            suffix: ubuntu24.04
          - label: Ubuntu 26.04
            image: ubuntu:26.04
            suffix: ubuntu26.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ dpkg-dev file python3 \
            qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6sql6-sqlite libgl-dev

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          version=$(sed -n 's/^project(blairqt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cd build
          cpack -G DEB
          mv "blairqt_${version}_amd64.deb" "../blairqt_${version}-${{ matrix.suffix }}_amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suffix }}
          path: blairqt_*_amd64.deb
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # cl.exe and the Windows SDK on PATH, for Ninja.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:QT_QPA_PLATFORM = 'offscreen'
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Portable layout: blairqt.exe, translations\, plugin_runner.py and
      # tools\ side by side, plus the Qt DLLs and plugins (windeployqt).
      #
      # The MSVC runtime is not copied in as DLLs. windeployqt adds the
      # Visual C++ redistributable installer, vc_redist.x64.exe, from the
      # Visual Studio that built the program, and README.txt in the zip
      # says to run it once per computer: the zip alone does not run on a
      # Windows without that runtime.
      #
      # Of the SQL drivers only SQLite is used; the others need client
      # libraries (libpq.dll and more) that the zip does not ship.
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(blairqt VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $dist = "dist\blairqt-$version-windows-x64"
          cmake --install build --prefix $dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --exclude-plugins qsqlmimer,qsqlodbc,qsqlpsql "$dist\blairqt.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $redist = Join-Path $dist 'vc_redist.x64.exe'
          if (-not (Test-Path $redist)) { throw "windeployqt did not add vc_redist.x64.exe" }
          $runtimeVersion = (Get-Item $redist).VersionInfo.ProductVersion
          Write-Output "Visual C++ runtime in the package: $runtimeVersion"

          $readme = (Get-Content packaging\windows\README.txt -Raw).Replace("`r`n", "`n").Replace("`n", "`r`n")
          $readme = $readme.Replace('@VERSION@', $version).Replace('@RUNTIME_VERSION@', $runtimeVersion)
          Set-Content -Path "$dist\README.txt" -Value $readme -Encoding utf8 -NoNewline

          Compress-Archive -Path $dist -DestinationPath "blairqt-$version-windows-x64.zip"

      # Checks the zip as a user gets it: unpacked to a new folder, with the
      # Qt installation hidden and only Windows on PATH, so nothing missing
      # from the zip can be found somewhere else on the runner.
      #
      # The runner has the Visual C++ runtime installed, so the start below
      # cannot show that vc_redist.x64.exe is needed. The import check lists
      # which DLLs come from it instead.
      - name: Check the package
        shell: pwsh
        run: |
          $zip = (Get-ChildItem blairqt-*-windows-x64.zip | Select-Object -First 1).FullName
          $unpacked = Join-Path $env:RUNNER_TEMP 'zipcheck'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $app = (Get-ChildItem $unpacked -Directory | Select-Object -First 1).FullName
          Write-Output "Checking $zip, unpacked in $app"

          # 1. The files the program needs at run time.
          $required = @(
            'blairqt.exe', 'README.txt', 'vc_redist.x64.exe', 'plugin_runner.py', 'tools\html_scrape_bridge.py',
            'translations\blairqt_en.qm', 'translations\blairqt_de.qm',
            'translations\blairqt_da.qm', 'translations\blairqt_ru.qm',
            'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'Qt6Sql.dll',
            'Qt6Multimedia.dll', 'Qt6MultimediaWidgets.dll', 'multimedia\ffmpegmediaplugin.dll',
            'platforms\qwindows.dll', 'sqldrivers\qsqlite.dll', 'tls\qschannelbackend.dll',
            'imageformats\qjpeg.dll', 'imageformats\qgif.dll', 'styles\qmodernwindowsstyle.dll',
            'licenses\MPL-2.0.txt', 'licenses\LGPL-3.0.txt', 'licenses\GPL-3.0.txt', 'licenses\NOTICE.txt')
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $app $_)) })
          if ($missing.Count -gt 0) { throw "missing from the package: $($missing -join ', ')" }
          $unwanted = @('sqldrivers\qsqlpsql.dll', 'sqldrivers\qsqlmimer.dll', 'sqldrivers\qsqlodbc.dll')
          $present = @($unwanted | Where-Object { Test-Path (Join-Path $app $_) })
          if ($present.Count -gt 0) { throw "should have been left out: $($present -join ', ')" }
          # The notice must name the Qt that is actually in the zip.
          if (-not (Select-String -Path (Join-Path $app 'licenses\NOTICE.txt') -SimpleMatch "Qt $env:QT_VERSION by The Qt Company" -Quiet)) {
            throw "licenses\NOTICE.txt does not name Qt $env:QT_VERSION"
          }

          # 2. Every DLL a binary in the package imports must be next to
          #    blairqt.exe, part of Windows, or the Visual C++ runtime.
          $vcRuntime = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll',
                         'msvcp140_2.dll', 'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
                         'concrt140.dll', 'vccorlib140.dll', 'vcomp140.dll')
          $nextToExe = @{}
          foreach ($file in Get-ChildItem $app -File -Filter *.dll) {
            $nextToExe[$file.Name.ToLower()] = $true
          }
          $fromRedist = @{}
          $unresolved = @()
          foreach ($binary in Get-ChildItem $app -Recurse -File -Include *.dll, *.exe) {
            if ($binary.Name -eq 'vc_redist.x64.exe') { continue }
            $output = dumpbin /nologo /dependents $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $($binary.FullName)" }
            foreach ($line in $output) {
              if (-not ($line -match '^\s+(\S+\.dll)\s*$')) { continue }
              $dll = $Matches[1].ToLower()
              if ($nextToExe.ContainsKey($dll)) { continue }
              if ($dll.StartsWith('api-ms-win-') -or $dll.StartsWith('ext-ms-')) { continue }
              if ($vcRuntime -contains $dll) { $fromRedist[$dll] = $true; continue }
              if (Test-Path (Join-Path $env:SystemRoot "System32\$dll")) { continue }
              $unresolved += "$($binary.FullName.Substring($app.Length + 1)) imports $dll"
            }
          }
          if ($unresolved.Count -gt 0) { throw ("imports found nowhere:`n" + ($unresolved -join "`n")) }
          Write-Output "Imports from the Visual C++ runtime (vc_redist.x64.exe): $(($fromRedist.Keys | Sort-Object) -join ', ')"

          # 3. Start it. The first start opens the main window and the
          #    welcome dialog and waits there, so after a while it must
          #    still run and show a window of its own.
          if (-not $env:QT_ROOT_DIR -or -not (Test-Path $env:QT_ROOT_DIR)) { throw "QT_ROOT_DIR is not the Qt installation" }
          $qtLeaf = Split-Path $env:QT_ROOT_DIR -Leaf
          $qtHidden = "$env:QT_ROOT_DIR.hidden"
          Rename-Item -Path $env:QT_ROOT_DIR -NewName "$qtLeaf.hidden"
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
            $env:QT_FORCE_STDERR_LOGGING = '1'
            $env:QT_DEBUG_PLUGINS = '1'
            $log = Join-Path $env:RUNNER_TEMP 'blairqt-start.log'
            $process = Start-Process -FilePath (Join-Path $app 'blairqt.exe') -WorkingDirectory $app `
              -RedirectStandardError $log -PassThru
            # Without a handle taken now, ExitCode stays empty after exit.
            $null = $process.Handle
            Start-Sleep -Seconds 20
            $running = -not $process.HasExited
            $windowTitle = ''
            if ($running) {
              $process.Refresh()
              $windowTitle = $process.MainWindowTitle
              Stop-Process -Id $process.Id -Force
            }
          } finally {
            Rename-Item -Path $qtHidden -NewName $qtLeaf
          }

          $lines = @(Get-Content $log)
          Write-Output "--- program output ($($lines.Count) lines)"
          $lines | ForEach-Object { Write-Output $_ }
          Write-Output '---'
          if (-not $running) {
            throw ("blairqt.exe exited during start, exit code 0x{0:X8}" -f $process.ExitCode)
          }
          # A missing DLL leaves the process waiting behind a system error
          # box, which belongs to Windows; only a window of its own shows
          # that the program got as far as its first dialog.
          Write-Output "Window: '$windowTitle'"
          if ($windowTitle -notlike '*B.LAIR_QT*') { throw "blairqt.exe runs but shows no window of its own" }
          $errors = @($lines | Where-Object { $_ -match 'driver not loaded|Could not (find|load) the Qt platform plugin|LibraryDatabase: failed' })
          if ($errors.Count -gt 0) { throw ("errors during start:`n" + ($errors -join "`n")) }
          # Plugins must come from the package; the Qt installation is hidden,
          # so a path outside the package and Windows means a stray copy
          # somewhere on the runner.
          $appSlashes = $app.Replace('\', '/')
          $windowsSlashes = $env:SystemRoot.Replace('\', '/')
          $loaded = @($lines | Where-Object { $_ -match 'loaded library' })
          $outside = @($loaded | Where-Object { -not $_.ToLower().Contains($appSlashes.ToLower()) } |
            Where-Object { -not $_.ToLower().Contains($windowsSlashes.ToLower()) })
          if ($outside.Count -gt 0) { throw ("plugins loaded from outside the package:`n" + ($outside -join "`n")) }
          foreach ($plugin in @('qwindows.dll', 'qsqlite.dll')) {
            if (-not ($loaded | Where-Object { $_ -match [regex]::Escape($plugin) })) {
              throw "$plugin was not loaded during start"
            }
          }
          Write-Output "Started from the package; loaded: $(($loaded | ForEach-Object { ($_ -split '[/\\]')[-1] -replace '".*', '' }) -join ', ')"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: blairqt-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    # Apple Silicon runner; the package is arm64 only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Install tools
        run: brew install ninja librsvg

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          version=$(sed -n 's/^project(blairqt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake --install build --prefix dist
          app=dist/blairqt.app

          # Icon: the SVG rendered at every size macOS asks for.
          mkdir blairqt.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" resources/blairqt.svg -o "blairqt.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            rsvg-convert -w "$double" -h "$double" resources/blairqt.svg -o "blairqt.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns blairqt.iconset -o "$app/Contents/Resources/blairqt.icns"

          macdeployqt "$app"
          # Apple Silicon runs nothing unsigned. macdeployqt rewrites the
          # binaries, so the whole bundle is signed again, ad hoc (no Apple
          # Developer identity: users confirm the first start in System
          # Settings -> Privacy & Security).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          test -f "$app/Contents/PlugIns/multimedia/libffmpegmediaplugin.dylib"
          # The app carries Qt, so it carries the license texts too.
          for license in MPL-2.0.txt LGPL-3.0.txt GPL-3.0.txt NOTICE.txt; do
            test -f "$app/Contents/Resources/licenses/$license"
          done
          grep -qF "Qt ${QT_VERSION} by The Qt Company" "$app/Contents/Resources/licenses/NOTICE.txt"

          hdiutil create -volname "B.LAIR_QT" -srcfolder "$app" -ov -format UDZO "blairqt-${version}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: blairqt-*-macos-arm64.dmg
          if-no-files-found: error

  freebsd:
    name: FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    # A package records the FreeBSD major version it was built on, and pkg
    # refuses one built for another major version.
    strategy:
      fail-fast: false
      matrix:
        release: ['14', '15']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Build, test, package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y cmake ninja qt6-base qt6-multimedia qt6-tools qt6-base_sqldriver-sqlite python3
          run: |
            set -e
            version=$(sed -n 's/^project(blairqt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            major=$(freebsd-version -u | cut -d. -f1)
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
            cmake --build build
            QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
            DESTDIR="$PWD/stage" cmake --install build
            sh packaging/freebsd/make-pkg.sh "$version" "$PWD/stage" "$PWD/pkgout"
            mv "pkgout/blairqt-${version}.pkg" "blairqt-${version}-freebsd${major}-amd64.pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.release }}
          path: blairqt-*-freebsd*-amd64.pkg
          if-no-files-found: error
