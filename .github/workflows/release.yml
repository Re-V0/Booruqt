# Publishes a release: for a v* tag, builds every package (build.yml) and
# attaches them to a GitHub release.
#
# GitHub is a push mirror of GitLab (canonical). Pushing a tag to GitLab
# lets the mirror bring it here, and that push starts this workflow. If it
# does not start (mirror not pushing tags, Actions disabled), run it by hand:
# Actions -> "Release packages" -> Run workflow, with the existing tag name.

name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, for example v0.3.2'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # A tag whose files still carry the previous version would publish
  # packages named and versioned wrongly; stop before building anything.
  check:
    name: Version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Compare version numbers
        run: |
          version="${TAG#v}"
          grep -q "^project(blairqt VERSION ${version} " CMakeLists.txt || { echo "CMakeLists.txt is not at ${version}"; exit 1; }
          grep -qx "pkgver=${version}" PKGBUILD || { echo "PKGBUILD is not at ${version}"; exit 1; }
          test -f "blairqt-${version}.ebuild" || { echo "blairqt-${version}.ebuild missing"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Release notes = the tagged commit's message, minus its trailers.
      # Re-running the workflow replaces the files of an existing release.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "${TAG#v}" --notes-file notes.md --verify-tag
          fi
